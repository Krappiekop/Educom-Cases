<html>
  <head>
    <title>Dynamic Table</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="//cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css"
    />
    <script src="./js/jquery.js"></script>
    <script src="//cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>

    <script src="06-jquery-database.js"></script>
  </head>
  <body>
    <table
      id="theBeatles"
      class="display nowrap dataTable dtr-inline collapsed"
    >
      <thead>
        <th>ID</th>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Date of Birth</th>
        <th>Email</th>
      </thead>
      <tbody></tbody>
    </table>

    <form id="personForm">
      <input type="text" id="firstname" placeholder="Firstname" required />
      <input type="text" id="lastname" placeholder="Lastname" required />
      <input type="email" id="email" placeholder="Email" required />
      <button type="submit">Save</button>
    </form>
  </body>
</html>
